# 產業範本：零售門市
# 用法：python tools/use_preset.py retail（會複製到 config/store.toml），再把店名、地址、電話改成你自己的。

[store]
name = "示範雜貨舖"
short_name = "示範雜貨"
address = "（請填店址）"
phone = "（請填電話）"
public_url = "http://localhost:8402"
port = 8402
cookie_name = "shopstaff"
logo = ""
industry = "retail"

[finance]
fin_start = "2026-01-01"
exp_start = "2026-01-01"
petty_from = "2026-01-01"
float_cash = 5000
expense_categories = ["進貨成本", "包材", "清潔文具雜支", "水電電信", "設備器具", "行銷與公關", "刷卡與平台手續費", "其他"]
unit_name = "件"

[modules]
safety = false
crm = false
delivery = false
marketing = true
news = true
journal = true

[sales]
area_core = []
area_outside_min = 0
min_order = 1
daily_call_target = 0

[ledger]
port = 8403
public_url = "http://localhost:8403"

[ai]
enabled = false
claude_bin = "claude"

[paths]
marketing_dir = "data/marketing"
