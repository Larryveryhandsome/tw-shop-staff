<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{SHORT_NAME}}"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/icon.svg">
<title>{{STORE_NAME}}</title>
<script>window.STORE = {{STORE_JSON}};</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<style>
/* ───────── 視覺：照 apple.com（台灣）— 系統字、大標題、#f5f5f7 底、白色圓角磚、藍色膠囊按鈕、半透明導覽列 ───────── */
:root{--bg:#f5f5f7;--tile:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#86868b;--line:#d2d2d7;--hair:rgba(0,0,0,.16);--soft:#e8e8ed;--fill:#fafafc;
  --blue:#0071e3;--blue-h:#0077ed;--link:#0066cc;--green:#03a10e;--orange:#bf4800;--red:#e30000;--ired:#ff3b30;--iblue:#007aff;--mine:#95ec69;--mine-ink:#111;
  --gnav:rgba(251,251,253,.8);--lnav:rgba(251,251,253,.92);--tab:rgba(250,250,252,.94);--gh:44px;--tabh:50px;
  --font:"SF Pro TC","SF Pro Text","SF Pro Icons","PingFang TC","Helvetica Neue","Noto Sans TC","Microsoft JhengHei",Helvetica,Arial,sans-serif;
  --fontd:"SF Pro TC","SF Pro Display","SF Pro Icons","PingFang TC","Helvetica Neue","Noto Sans TC","Microsoft JhengHei",Helvetica,Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--tile:#1d1d1f;--ink:#f5f5f7;--ink2:#a1a1a6;--ink3:#86868b;--line:#424245;--hair:rgba(255,255,255,.16);--soft:#2c2c2e;--fill:#161617;
  --blue:#0071e3;--link:#2997ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--mine:#2f7d32;--mine-ink:#fff;--gnav:rgba(22,22,23,.8);--lnav:rgba(29,29,31,.92);--tab:rgba(22,22,23,.94);color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.47059 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  padding-bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
[hidden]{display:none!important}.num{font-variant-numeric:tabular-nums}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* 頂列：在 body 下面另外定義 */
.pillbtn{border:0;border-radius:980px;background:var(--blue);color:#fff;font-size:12px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.pillbtn:hover{background:var(--blue-h)}
/* 版心 */
.main{max-width:1024px;margin:0 auto;padding:28px 16px 40px}
.eyebrow{font:600 17px/1.2 var(--fontd);color:var(--orange);margin:0 0 6px}
.headline{font:600 34px/1.1 var(--fontd);letter-spacing:.004em;margin:0 0 10px}
.sub{font:400 19px/1.4 var(--font);color:var(--ink2);margin:0 0 26px}
h2{font:600 24px/1.17 var(--fontd);margin:40px 0 16px}h2 .g{color:var(--ink2)}h3{font:600 19px/1.25 var(--fontd);margin:0 0 12px}
.small,.muted{font-size:14px;color:var(--ink2);line-height:1.43}.err{color:var(--red);font-weight:500;margin-top:10px;font-size:14px}.okmsg{color:var(--green);font-weight:500;margin-top:10px;font-size:14px}
/* 磚 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
.tile{background:var(--tile);border-radius:18px;padding:18px 20px}
.stat .k{font-size:14px;font-weight:600;color:var(--ink2)}.stat .v{font:600 32px/1.12 var(--fontd);letter-spacing:.004em;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .s{font-size:13px;color:var(--ink2);margin-top:2px}.stat.warn .v{color:var(--orange)}.stat.good .v{color:var(--green)}
.card{background:var(--tile);border-radius:18px;padding:20px;margin-bottom:16px}
.card.flat{background:transparent;padding:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.row .n{font-weight:600}.row .m{font-size:14px;color:var(--ink2);margin-top:2px}.click{cursor:pointer}
/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:980px;background:var(--blue);color:#fff;font-size:17px;padding:11px 22px;min-height:44px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--blue-h);text-decoration:none}.btn.sec{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}.btn.sec:hover{background:rgba(0,113,227,.06)}
.btn.gray{background:var(--soft);color:var(--ink)}.btn.red{background:var(--red)}.btn.green{background:var(--green)}.btn.full{width:100%}
.btn.sm{font-size:14px;padding:6px 14px;min-height:32px}.btn:disabled{opacity:.42;cursor:not-allowed}
.btn:focus-visible,.tabbar button:focus-visible,summary:focus-visible,.topbar a:focus-visible,.segctl button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.more{color:var(--link);cursor:pointer}.more::after{content:" ›"}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
/* 標籤 */
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:980px;background:var(--soft);color:var(--ink2);margin:4px 4px 0 0;white-space:nowrap;vertical-align:middle}
.t-ok{background:rgba(3,161,14,.12);color:var(--green)}.t-warn{background:rgba(191,72,0,.12);color:var(--orange)}.t-red{background:var(--red);color:#fff}.t-blue{background:rgba(0,113,227,.1);color:var(--blue)}
/* 表單 */
input,select,textarea{width:100%;font-size:17px;padding:13px 15px;border:1px solid var(--ink3);border-radius:12px;background:var(--tile);color:var(--ink)}
textarea{line-height:1.5}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,125,250,.22)}
label{display:block;font-size:14px;color:var(--ink2);margin:14px 0 6px;font-weight:600}
label.chk{display:flex;align-items:center;gap:10px;font-weight:400;color:var(--ink);font-size:17px}label.chk input{width:22px;height:22px;flex:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--soft);padding:3px;border-radius:10px;gap:2px}.seg button{flex:1;padding:8px 6px;border:0;border-radius:8px;background:none;font-size:15px;cursor:pointer}
.seg button.on{background:var(--tile);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:12px 0 0}.pills::-webkit-scrollbar{display:none}
.pill{flex:none;font-size:14px;padding:7px 14px;border-radius:980px;border:1px solid var(--line);background:var(--tile);cursor:pointer;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* 表格、收合 */
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:12px;font-weight:600;color:var(--ink2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}td.r,th.r{text-align:right;white-space:nowrap}td .s{display:block;font-size:12px;color:var(--ink2)}
details.fold{background:var(--tile);border-radius:18px;margin-bottom:12px}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:17px 20px;font:600 17px/1.3 var(--font)}
details.fold>summary::-webkit-details-marker{display:none}details.fold>summary small{margin-left:auto;font-size:14px;font-weight:400;color:var(--ink2)}
details.fold>summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .25s}
details.fold[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}details.fold>.in{padding:0 20px 20px}
/* 提示條 */
.banner{display:flex;align-items:center;gap:10px;border-radius:14px;padding:13px 16px;margin-bottom:12px;font-size:15px;font-weight:500}
.banner.blue{background:rgba(0,113,227,.09);color:var(--blue);cursor:pointer}.banner.warn{background:rgba(191,72,0,.1);color:var(--orange)}
.banner.red{background:rgba(227,0,0,.08);color:var(--red)}.banner.ok{background:rgba(3,161,14,.1);color:var(--green)}
.banner b{font-weight:700}
/* 手機底部分頁（iOS tab bar） */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tab);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--hair);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;height:var(--tabh);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;font-weight:500;color:var(--ink3);position:relative;cursor:pointer}
.tabbar button svg{width:27px;height:27px}.tabbar button.on{color:var(--iblue)}
.badge{position:absolute;top:2px;left:calc(50% + 5px);min-width:18px;height:18px;border-radius:9px;background:var(--ired);color:#fff;font-size:12px;font-weight:600;line-height:18px;text-align:center;padding:0 5px;border:1.5px solid var(--tab)}
.badge.bang{font-weight:800}
/* 彈出（手機從下方、電腦置中） */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet>.pane{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ink3);opacity:.4;margin:0 auto 12px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.shead h3{margin:0;font-size:21px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}
/* 「更多」選單（iOS 清單） */
.list{background:var(--tile);border-radius:12px;overflow:hidden}.list button{width:100%;display:flex;align-items:center;gap:14px;padding:13px 16px;border:0;background:none;border-bottom:1px solid var(--line);font-size:17px;text-align:left;cursor:pointer}
.list button:last-child{border-bottom:0}.list button .ic{width:30px;height:30px;border-radius:8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center}
.list button .ic svg{width:19px;height:19px}.list button .chev{margin-left:auto;color:var(--ink3)}.list button .badge{position:static;margin-left:auto}
/* 聚光燈：新公告 */
.spotfog{position:fixed;inset:0;z-index:55;cursor:pointer}
.spotlit{position:relative;z-index:60;box-shadow:0 0 0 3px var(--blue),0 0 0 200vmax rgba(0,0,0,.74)!important;animation:lit .5s cubic-bezier(.2,.9,.3,1.25)}
@keyframes lit{from{transform:scale(.96)}to{transform:none}}
.spotlabel{position:absolute;top:-38px;left:0;background:var(--blue);color:#fff;font-size:13px;font-weight:600;padding:6px 12px;border-radius:980px;white-space:nowrap}
/* 打卡 */
.punchbox{text-align:center;padding:30px 18px 26px}
.clock{font:600 clamp(64px,18vw,112px)/1 var(--fontd);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.punch{width:min(220px,60vw);height:min(220px,60vw);border-radius:50%;border:0;margin:24px auto 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--blue);color:#fff;font:600 26px/1.2 var(--fontd);cursor:pointer;box-shadow:0 14px 40px rgba(0,113,227,.35);transition:transform .15s}
.punch small{font:400 14px var(--font);opacity:.85;margin-top:6px}.punch.out{background:#1d1d1f;box-shadow:0 14px 40px rgba(0,0,0,.25)}.punch:active{transform:scale(.97)}.punch:disabled{opacity:.5}
/* 日誌（LINE） */
.chat{padding-bottom:96px}.daysep{text-align:center;margin:20px 0 10px}.daysep span{font-size:12px;color:var(--ink2);background:var(--soft);padding:3px 11px;border-radius:980px}
.msg{display:flex;gap:8px;margin:8px 0;align-items:flex-end}.msg.mine{flex-direction:row-reverse}
.av{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex:none}.av.boss{background:#1d1d1f}
.msg .col{max-width:min(74%,560px);display:flex;flex-direction:column}.msg.mine .col{align-items:flex-end}.msg .who{font-size:12px;color:var(--ink2);margin:0 0 3px 4px}
.bub{padding:9px 14px;border-radius:20px;background:var(--tile);white-space:pre-wrap;word-break:break-word;line-height:1.55;font-size:16px}
.msg.mine .bub{background:var(--mine);color:var(--mine-ink)}.bub img{display:block;max-width:100%;max-height:360px;border-radius:14px;margin:2px 0;cursor:zoom-in}
.bub.gone{background:none;border:1px dashed var(--line);color:var(--ink2);font-size:13px}.msg .meta{font-size:11px;color:var(--ink2);white-space:nowrap;margin:0 2px 2px}.msg .meta a{margin-left:6px}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));z-index:25;background:var(--lnav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--hair);padding:8px 12px}
.composer>div{max-width:1024px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}.composer textarea{flex:1;resize:none;min-height:44px;max-height:150px;border-radius:22px;padding:10px 16px;line-height:1.45}
.ibtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}.ibtn.send{background:var(--blue);color:#fff}
.preview{display:flex;align-items:center;gap:8px;max-width:1024px;margin:0 auto 8px;font-size:13px;color:var(--ink2)}.preview img{height:54px;border-radius:8px}
.thread{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}.thread:last-child{border-bottom:0}
.thread .t{flex:1;min-width:0}.thread .last{font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{min-width:22px;height:22px;border-radius:11px;background:var(--ired);color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.zoom{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;cursor:zoom-out}.zoom img{max-width:96vw;max-height:92vh;border-radius:8px}
/* 公告、訓練 */
.notice .body,.mbody{white-space:pre-wrap;line-height:1.8;font-size:16px}.mbody .subt{display:block;font-weight:700;font-size:17px;margin-top:8px}
.chap{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px;font:600 21px/1.2 var(--fontd)}.chap small{font-size:14px;font-weight:400;color:var(--ink2)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:10px}.bar>i{display:block;height:100%;background:var(--green);border-radius:3px}
/* 班表（月曆） */
.calwrap{background:var(--tile);border-radius:18px;overflow:hidden;box-shadow:2px 4px 12px rgba(0,0,0,.06)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.cal .h{font-size:12px;font-weight:600;color:var(--ink2);text-align:right;padding:12px 10px 8px;border-bottom:1px solid var(--line)}
.cal .h:first-child,.cal .h:last-child{color:var(--ink3)}
.cal .d{min-height:78px;padding:6px 6px 8px;font-size:12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:relative;min-width:0}
.cal .d:nth-child(7n){border-right:0}.cal .d.edit{cursor:pointer;transition:background .15s}.cal .d.edit:hover{background:var(--fill)}
.cal .d .dn{display:flex;justify-content:flex-end}.cal .d .dn span{min-width:26px;height:26px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;font:500 14px var(--fontd);padding:0 6px}
.cal .d.today .dn span{background:var(--ired);color:#fff;font-weight:600}
.cal .d.closed{background:var(--fill)}.cal .d.closed .dn span{color:var(--ink3)}.cal .d.blank{background:var(--fill)}
.cal .d .off{display:block;margin-top:3px;background:rgba(255,149,0,.16);color:#b25000;border-left:3px solid #ff9500;border-radius:4px;padding:1px 5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .d .off.me{background:#ff9500;color:#fff}.cal .d .duty{display:block;margin-top:3px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.calbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
.calbar .ttl{font:600 32px/1.1 var(--fontd);margin:0}
.paddles{display:flex;gap:10px;align-items:center}
.paddle{width:36px;height:36px;border-radius:50%;border:0;background:rgba(210,210,215,.64);color:rgba(0,0,0,.56);font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s}
.paddle:hover{background:rgba(223,223,227,.7);color:rgba(0,0,0,.64)}.paddles .today{border:0;background:none;color:var(--link);font-size:14px;cursor:pointer;padding:0 4px}
/* 外送看板 */
.lane{display:grid;grid-template-columns:1fr;gap:12px}.dcard{background:var(--tile);border-radius:16px;padding:15px 16px;border-left:5px solid var(--line)}
.dcard.st-新單{border-left-color:var(--ink3)}.dcard.st-製作中{border-left-color:var(--orange)}.dcard.st-待取餐{border-left-color:var(--blue)}.dcard.st-配送中{border-left-color:#8e44ad}.dcard.st-已送達{border-left-color:var(--green);opacity:.75}
.dcard.late{box-shadow:inset 0 0 0 2px var(--red)}.dcard .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.dcard .due{font:600 21px var(--fontd);font-variant-numeric:tabular-nums}
.steps{display:flex;gap:4px;margin:10px 0 2px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--soft)}.steps i.on{background:var(--blue)}
.login{max-width:440px;margin:10vh auto 40px;padding:0 20px}.login .card{padding:30px 28px}
.login .brand{text-align:center;margin-bottom:26px}.login .brand img{height:76px;width:auto;margin:0 auto 14px;display:block}.login .brand .nm{font:600 14px var(--fontd);color:var(--ink2);margin-bottom:10px}
.login .brand h1{font:600 32px/1.12 var(--fontd);margin:0}.login .brand p{color:var(--ink2);margin:8px 0 0;font-size:17px}
/* 磚：Apple Store 卡片的陰影、可以點的會浮起來 */
.tile,.card{box-shadow:2px 4px 12px rgba(0,0,0,.05)}.card.flat{box-shadow:none}
.click,.thread,.dcard{transition:box-shadow .3s cubic-bezier(0,0,.5,1),transform .3s cubic-bezier(0,0,.5,1)}
.dcard:hover{box-shadow:2px 4px 16px rgba(0,0,0,.12);transform:scale(1.008)}
/* 進頁面輕輕浮上來 */
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.main.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}.main.enter>*:nth-child(2){animation-delay:.04s}.main.enter>*:nth-child(3){animation-delay:.08s}
.main.enter>*:nth-child(4){animation-delay:.12s}.main.enter>*:nth-child(n+5){animation-delay:.16s}
/* 頁尾：apple.com 的灰色小字 */
.foot{max-width:1024px;margin:0 auto;padding:18px 16px 20px;font-size:12px;color:var(--ink2);border-top:1px solid var(--line);line-height:1.6}
.foot b{color:var(--ink);font-weight:600}
@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.headline{font-size:40px}.lane{grid-template-columns:repeat(2,1fr)}}
/* 電腦：上面 apple.com 式的全站導覽＋下面的頁面導覽；不顯示手機分頁 */
@media (min-width:834px){
  body{padding-bottom:0}
  .tabbar{display:none}.main{padding:52px 22px 80px}.headline{font-size:48px;line-height:1.08}.sub{font-size:21px}
  .card{padding:26px 28px}.tile{padding:24px 26px}.stat .v{font-size:40px}
  .sheet{align-items:center}.sheet>.pane{max-width:680px;max-height:86vh;border-radius:18px;padding:22px 26px 28px;margin:20px}.grab{display:none}
  .composer{bottom:0}.chat{padding-bottom:84px}.cal .d{min-height:112px;padding:6px 8px 8px;font-size:13px}.lane{grid-template-columns:repeat(3,1fr)}
  .foot{padding:18px 22px 34px}.calbar .ttl{font-size:40px}h2{font-size:28px}
  .click:hover,.thread:hover{transform:none}
}
/* ── 頂列：一條就好。左 LOGO＋店名，中 主要頁面（電腦），右 使用者 ── */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(0,0,0,.08);padding-top:env(safe-area-inset-top)}
.topbar .in{max-width:1024px;margin:0 auto;height:52px;padding:0 16px;display:flex;align-items:center;gap:12px}
.topbar .brand{display:flex;align-items:center;gap:9px;font:600 17px var(--fontd);color:var(--ink);text-decoration:none;cursor:pointer;white-space:nowrap;flex:none}
.topbar .brand img{height:30px;width:auto;display:block}.topbar .brand:hover{text-decoration:none}
.topbar nav{display:none}
/* 老闆模擬店長／夥伴時：頂列下面一條黑色提示 */
.actbar{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:29;background:#1d1d1f;color:#f5f5f7;font-size:13px;padding:8px 16px;
  display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;text-align:center}
.actbar b{font-weight:600}.actbar button{border:0;border-radius:980px;background:#f5f5f7;color:#1d1d1f;font-size:13px;font-weight:600;padding:5px 14px;cursor:pointer}
.rolepick{display:grid;gap:10px}.rolepick button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);background:var(--tile);border-radius:14px;padding:14px 16px;cursor:pointer;font-size:16px;color:var(--ink)}
.rolepick button.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}.rolepick button .t{font-weight:600}.rolepick button .s{font-size:13px;color:var(--ink2);margin-top:2px}
.rolepick button .ck{margin-left:auto;color:var(--blue);font-weight:700}
.topbar .user{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);white-space:nowrap;cursor:pointer;flex:none}
.topbar .user .av{width:30px;height:30px;font-size:13px;background:var(--soft);color:var(--ink)}
.topbar .user .nm{display:none}
@media (prefers-color-scheme:dark){.topbar{background:rgba(22,22,23,.78);border-bottom-color:rgba(255,255,255,.1)}}
/* ── 頁首：大標題（＋右邊主要按鈕），下面 Apple 分段控制當子分頁 ── */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.phead .tx{min-width:0;flex:1 1 320px}.phead .act{flex:none;margin-bottom:26px}
.segctl{display:inline-grid;grid-auto-flow:column;grid-auto-columns:minmax(0,auto);gap:2px;background:rgba(118,118,128,.12);padding:2px;border-radius:10px;margin:0 0 26px;max-width:100%}
.segctl button{border:0;background:none;padding:7px 18px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;white-space:nowrap;position:relative;transition:background .2s}
.segctl button:hover:not(.on){background:rgba(118,118,128,.1)}
.segctl button.on{background:var(--tile);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
.segctl .n{display:inline-block;min-width:17px;height:17px;line-height:17px;border-radius:9px;background:var(--ired);color:#fff;font-size:11px;font-weight:600;text-align:center;margin-left:5px;padding:0 4px}
@media (max-width:640px){
  .segctl{display:grid;grid-auto-flow:row;grid-template-columns:repeat(var(--segn,3),minmax(0,1fr));width:100%}
  .segctl button{padding:8px 4px;font-size:13px}.phead .act{margin-bottom:18px}
}
@media (min-width:834px){
  .topbar .in{padding:0 22px}
  .topbar nav{display:flex;align-items:center;gap:2px;margin:0 auto}
  .topbar nav a{font-size:14px;color:var(--ink);padding:7px 13px;border-radius:980px;text-decoration:none;cursor:pointer;position:relative;white-space:nowrap;transition:background .2s}
  .topbar nav a:hover{background:none;color:var(--ink);opacity:.65;text-decoration:none}
  .topbar nav a.on,.topbar nav a.on:hover{background:rgba(0,0,0,.08);font-weight:600;opacity:1}
  .topbar nav a .badge{top:-1px;left:auto;right:-2px;min-width:16px;height:16px;line-height:14px;font-size:10px;border-width:1px;border-color:#fff}
  .topbar .user{margin-left:0}.topbar .user .nm{display:inline}
}

/* ── v4：導覽聚光燈 ── */
.tour{position:fixed;inset:0;z-index:200}.tour-block{position:absolute;inset:0}
.tour-hole{position:fixed;border-radius:14px;box-shadow:0 0 0 200vmax rgba(0,0,0,.58);transition:all .3s cubic-bezier(.2,.8,.2,1);pointer-events:none;outline:2px solid rgba(255,255,255,.9)}
.tour-card{position:fixed;background:var(--tile);color:var(--ink);border-radius:18px;padding:18px 20px 14px;box-shadow:0 18px 50px rgba(0,0,0,.3);transition:top .3s,left .3s;max-width:calc(100vw - 24px)}
.tour-card.center{left:50%!important;top:50%!important;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 24px))!important}
.tour-card h4{margin:2px 0 6px;font:600 19px var(--fontd)}.tour-card p{margin:0;color:var(--ink2);font-size:15px;line-height:1.55}
.tour-n{font-size:12px;color:var(--ink3);font-weight:600}.tour-btns{display:flex;align-items:center;gap:8px;margin-top:14px}
.tour-skip{border:0;background:none;color:var(--ink2);font-size:14px;cursor:pointer;padding:6px 0}
.helpbtn{width:30px;height:30px;border-radius:15px;border:0;background:var(--soft);color:var(--ink);font:600 15px var(--fontd);cursor:pointer;flex:none}
/* ── v4：每週新聞（照 Apple Newsroom） ── */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin:6px 0 26px}
.ncard{background:var(--tile);border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);display:flex;flex-direction:column}
.ncard .cover svg{display:block;width:100%;height:auto;aspect-ratio:2/1}.ncard .in{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.ncard .cat{font-size:12px;font-weight:700;letter-spacing:.02em}.ncard h3{margin:0;font:600 21px/1.3 var(--fontd)}.ncard p{margin:0;color:var(--ink2);line-height:1.6}
.ncard .tip{background:var(--bg);border-left:3px solid var(--blue);border-radius:8px;padding:9px 12px;font-size:14px;line-height:1.55}.ncard .tip::before{content:'對我們店　';font-weight:700;color:var(--blue)}
.ncard .src{margin-top:auto;font-size:13px;color:var(--ink3);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ncard .src a{margin-left:auto;font-weight:600}
/* ── v4：日誌（Apple 風格，一天一張卡） ── */
.jhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.jhead b{font:600 19px var(--fontd)}
.jent{padding:10px 0;border-top:1px solid var(--line)}.jent:first-of-type{border-top:0}.jent .txt{white-space:pre-wrap;word-break:break-word;line-height:1.65;font-size:16px}
.jent img{display:block;max-width:min(100%,420px);max-height:360px;border-radius:12px;margin-top:8px;cursor:zoom-in}
.jent.boss{background:rgba(0,113,227,.06);border:0;border-left:3px solid var(--blue);border-radius:10px;padding:10px 14px;margin:8px 0}
.jent .who{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:3px;display:flex;gap:8px;align-items:center}.jent .who2{margin-bottom:2px}
.jent.gone{color:var(--ink3);font-size:13px;font-style:italic}
.jreply{display:flex;gap:8px;align-items:flex-end;margin-top:10px}.jreply textarea{flex:1;resize:none;min-height:40px;border-radius:12px}
#jcomp textarea{width:100%;resize:vertical;line-height:1.6}#jcomp .preview{margin-top:8px}
/* ── v4：個人檔案、待辦 ── */
.pav{border-radius:50%;object-fit:cover;flex:none;display:inline-block;background:var(--soft)}.pav.ph{display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink2)}
.profhead{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.mate{display:flex;gap:12px;align-items:flex-start}.mate .m{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.5}
.row.todo{align-items:flex-start;gap:12px}.row.todo.done .n{text-decoration:line-through;color:var(--ink3)}
.tck{position:relative;flex:none;margin-top:2px}.tck input{position:absolute;opacity:0;width:26px;height:26px;margin:0;cursor:pointer}
.tck span{display:block;width:24px;height:24px;border-radius:12px;border:2px solid var(--ink3)}.tck input:checked+span{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 3px var(--tile)}
.ctoast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom));z-index:120;background:#1d1d1f;color:#fff;border-radius:16px;padding:10px 12px 10px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 24px);flex-wrap:wrap}
@media (min-width:834px){.ctoast{bottom:24px}}
.sfbad{color:var(--red);font-weight:700}.sfok{color:var(--green);margin-left:4px;font-weight:700}.sfph{cursor:pointer;text-decoration:none}
/* 手機：不要左右滑。表格變成一張張卡片（左邊欄名、右邊數字），子分頁換行 */
.main{overflow-x:clip}.g2>*,.g3>*{min-width:0}input,select{min-width:0}
@media (max-width:640px){
  .pills{flex-wrap:wrap;overflow:visible}
  .tbl{overflow:visible}.tbl table tr:has(th){display:none}
  .tbl table tr{display:block;padding:10px 0;border-bottom:1px solid var(--line)}.tbl table tr:last-child{border-bottom:0}
  .tbl table td{display:block;border:0;padding:3px 0;text-align:right;min-height:24px}
  .tbl table td::before{content:attr(data-l);float:left;color:var(--ink2);font-size:14px;margin-right:12px}
  .tbl table td:first-child{text-align:left;font-size:17px}.tbl table td:first-child::before{display:none}
  .tbl table td[colspan]{text-align:left}.tbl table td[colspan]::before{display:none}
  .tbl table td input,.tbl table td select{width:auto!important;max-width:60%;display:inline-block}
  .tbl table td .s{display:inline;margin-left:6px}
  .grid .tile{padding:16px}.stat .v{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<!-- 登入 -->
<div id="loginView" class="login" hidden>
  <div class="brand">{{LOGO}}<div class="nm">{{STORE_NAME}}</div><h1>登入</h1><p>夥伴、店長、老闆都從這裡登入。</p></div>
  <div class="card">
    <label for="lu">帳號</label><input id="lu" autocomplete="username" autocapitalize="off">
    <label for="lp">密碼</label><input id="lp" type="password" autocomplete="current-password">
    <button class="btn full" style="margin-top:20px" onclick="login()">登入</button>
    <div id="lerr" class="err"></div>
    <div class="small" style="margin-top:14px">登入一次可以保持 90 天。新夥伴請按 <a class="more" onclick="showReg()">註冊帳號</a></div>
  </div>
</div>
<div id="regView" class="login" hidden>
  <div class="brand">{{LOGO}}<div class="nm">{{STORE_NAME}}</div><h1>新夥伴註冊</h1><p>送出後老闆審核，核准就能登入。</p></div>
  <div class="card">
    <label for="rn">名字</label><input id="rn" placeholder="大家怎麼叫你">
    <label for="ru">帳號（英文小寫或數字，3–20 個字）</label><input id="ru" autocapitalize="off" autocomplete="username">
    <div class="g2"><div><label for="rp1">密碼（至少 6 碼）</label><input id="rp1" type="password" autocomplete="new-password"></div>
      <div><label for="rp2">再輸入一次</label><input id="rp2" type="password" autocomplete="new-password"></div></div>
    <label for="rph">手機（老闆聯絡你用）</label><input id="rph" inputmode="tel">
    <label>應徵</label><div class="seg" id="rpos"><button class="on" onclick="seg(this)">外場</button><button onclick="seg(this)">內場</button><button onclick="seg(this)">外送</button><button onclick="seg(this)">PT</button></div>
    <label for="rnote">想跟老闆說的（選填）</label><input id="rnote">
    <button class="btn full" style="margin-top:20px" onclick="register()">送出註冊</button>
    <div id="rerr" class="err"></div>
    <div class="small" style="margin-top:14px"><a class="more" onclick="showLogin()">回到登入</a></div>
  </div>
</div>
<div id="setpwView" class="login" hidden>
  <div class="brand">{{LOGO}}<div class="nm">{{STORE_NAME}}</div><h1>設定你自己的密碼</h1><p>第一次登入，換成只有你知道的密碼。</p></div>
  <div class="card">
    <label for="sp1">新密碼（至少 6 碼，不要跟帳號一樣）</label><input id="sp1" type="password" autocomplete="new-password">
    <label for="sp2">再輸入一次</label><input id="sp2" type="password" autocomplete="new-password">
    <button class="btn full" style="margin-top:20px" onclick="setFirstPw()">設定並進入</button><div id="sperr" class="err"></div>
  </div>
</div>

<!-- 主程式 -->
<div id="app" hidden>
  <header class="topbar"><div class="in"><a class="brand" onclick="go(HOME)">{{LOGO}}{{SHORT_NAME}}</a>
    <nav id="gnav"></nav><button class="helpbtn" id="helpbtn" title="這頁怎麼用" onclick="replayTour()">?</button><div class="user" id="gme" onclick="go('me')"></div></div></header>
  <div class="actbar" id="actbar" hidden></div>
  <main class="main" id="main"></main>
  <footer class="foot"><b>{{STORE_NAME}}</b>　{{FOOTER}}<br>打卡、薪資、帳務都以這個系統為準；有問題請找店長或老闆。</footer>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="sheet" class="sheet" hidden onclick="if(event.target===this)closeSheet()"><div class="pane" id="sheetBody"></div></div>
<script src="/static/core.js?v=20261024a"></script>
<script src="/static/pages.js?v=20261024a"></script>
<script src="/static/crm.js?v=20261024a"></script>
<script src="/static/boss.js?v=20261024a"></script>
<script src="/static/ops.js?v=20261024a"></script>
<script src="/static/extras.js?v=20261024a"></script>
<script src="/static/safety.js?v=20261024a"></script>
<script src="/static/marketing.js?v=20261024a"></script>
<script>boot();</script>
</body></html>
