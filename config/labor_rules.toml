# 薪資計算規則（依《勞動基準法》設定的預設值）
#
# ⚠️ 重要：以下為依勞基法整理的「原則上」預設值，僅供參考，不構成法律意見。
#    基本工資、國定假日、勞健保級距每年會變動，請以勞動部、勞保局、
#    行政院人事行政總處的最新公告為準，必要時請洽勞工主管機關或專業人士。

[minimum_wage]
# 基本工資（勞基法第 21 條，每年由勞動部公告）。低於基本工資時，系統會在老闆頁警示。
2026 = { monthly = 29500, hourly = 196 }

[overtime]
# 平日延長工時（勞基法第 24 條第 1 項）：每日超過 8 小時的部分
daily_regular_minutes = 480
first_2h_rate = 1.34     # 前 2 小時：平日每小時工資額 × 1又1/3 以上（實務上常取 1.34）
next_2h_rate = 1.67      # 再延長 2 小時以內：× 1又2/3 以上（常取 1.67）
daily_max_minutes = 720  # 一日正常工時＋延長工時合計不得超過 12 小時（第 32 條）；超過會標示警告

[rest_day]
# 休息日出勤（勞基法第 24 條第 2 項）：以「每週第 6 個出勤日」視為休息日出勤
enabled = true
first_2h_rate = 1.34     # 前 2 小時：另再加給 1又1/3 以上
next_6h_rate = 1.67      # 第 3～8 小時：另再加給 1又2/3 以上
over_8h_rate = 2.67      # 第 9～12 小時：另再加給 2又2/3 以上
# 每週第 7 個出勤日＝例假日出勤（第 36、40 條原則上不得出勤），系統會標示警告並加倍給薪

[holiday]
# 國定假日出勤（勞基法第 39 條）：工資加倍發給
enabled = true
# 2026 年應放假日：請依行政院人事行政總處與勞動部公告逐年核對、自行增減
dates_2026 = [
  "2026-01-01",                                         # 開國紀念日
  "2026-02-16", "2026-02-17", "2026-02-18", "2026-02-19", # 除夕、春節（初一～初三）
  "2026-02-28",                                         # 和平紀念日
  "2026-04-04", "2026-04-05",                           # 兒童節、清明節
  "2026-05-01",                                         # 勞動節
  "2026-06-19",                                         # 端午節
  "2026-09-25",                                         # 中秋節
  "2026-09-28",                                         # 教師節（孔子誕辰紀念日）
  "2026-10-10",                                         # 國慶日
  "2026-10-25",                                         # 臺灣光復暨金門古寧頭大捷紀念日
  "2026-12-25",                                         # 行憲紀念日
]

[monthly]
# 月薪制：每小時工資額＝月薪 ÷ 30 ÷ 8（勞動部常見計算方式）
hourly_divisor = 240
# 「應上班時數」沒做滿時，依實際出勤分鐘比例計薪（例如請事假）。
# 應上班天數＝當月天數 − 表定月休天數 − 當月國定假日天數（國定假日原則上照給工資）

[rest_break]
# 休息時間（勞基法第 35 條）：繼續工作 4 小時，至少應有 30 分鐘休息
after_minutes = 240
min_break_minutes = 30
tolerance_minutes = 15     # 提早打卡、晚一點下班的容許誤差，超過才提醒

[late]
# 遲到：工時以打卡分鐘計算，遲到的分鐘本來就不會算進工時，等於「依實際分鐘比例」扣薪。
# 系統不提供「遲到幾次扣一天」這類額外罰扣（可能違反勞基法第 26 條「預扣工資作為違約金」）。
absent_over_minutes = 10   # 晚超過幾分鐘標示「需確認」，交給老闆人工處理，不自動扣錢

[insurance]
# 勞保、健保、勞退（勞工自付額請依勞保局、健保署級距表，在每位員工的薪資設定裡填）
pension_employer_rate = 0.06   # 雇主提繳勞退至少 6%（勞工退休金條例第 14 條），只顯示、不從薪水扣
