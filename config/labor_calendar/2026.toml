# 2026 年勞動曆：基本工資＋國定假日（勞工應放假之紀念日及節日）
#
# 每年一個檔案，檔名就是年份（2026.toml、2027.toml……）。新年度的做法：
#   1. 複製這個檔案，改名成新年份（例：2027.toml），把 year 改成新年份
#   2. [minimum_wage]：照勞動部公告的新年度基本工資填（通常前一年 9 月公告）
#   3. [holidays] dates：照行政院人事行政總處行事曆、勞動部公告，填新年度的國定假日；
#      國定假日逢例假日或休息日，原則上應另行補假（勞雇協商日期），補假日也請加進清單
#   4. 改 checked（你核對的日期）、source（你看的是哪一份公告）
#   5. 重新啟動系統；老闆首頁的紅色提醒會消失
# 當年度的檔案不存在或缺欄位時，系統啟動會印警告、老闆首頁和薪資頁會顯示紅色提醒，
# 國定假日出勤「不會」自動加倍、基本工資檢查只會標明「暫用舊年度數字」，不會靜靜沿用舊值。
#
# ⚠️ 以下為依公告整理的參考值，不構成法律意見，請以勞動部、人事行政總處最新公告為準。

year = 2026
source = "勞動部公告 2026 年基本工資；行政院人事行政總處 2026 年行事曆；紀念日及節日實施條例（2025 修正）"
checked = "2026-10-24"

[minimum_wage]
# 基本工資（勞基法第 21 條）。低於基本工資時，老闆薪資頁會提醒。
monthly = 29500
hourly = 196

[holidays]
# 國定假日出勤工資加倍（勞基法第 39 條）；月薪制的應上班天數會扣掉這些日子
dates = [
  "2026-01-01",                                         # 開國紀念日
  "2026-02-15",                                         # 小年夜（除夕前一日；本年逢週日）
  "2026-02-16", "2026-02-17", "2026-02-18", "2026-02-19", # 除夕、春節（初一～初三）
  "2026-02-28",                                         # 和平紀念日
  "2026-04-04", "2026-04-05",                           # 兒童節、清明節
  "2026-05-01",                                         # 勞動節
  "2026-06-19",                                         # 端午節
  "2026-09-25",                                         # 中秋節
  "2026-09-28",                                         # 教師節（孔子誕辰紀念日）
  "2026-10-10",                                         # 國慶日
  "2026-10-25",                                         # 臺灣光復暨金門古寧頭大捷紀念日
  "2026-12-25",                                         # 行憲紀念日
]
