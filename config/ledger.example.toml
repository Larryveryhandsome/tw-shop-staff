# 股東帳務設定（範例）
# 使用方式：複製一份到 data/ledger.toml（data/ 不進 git），再改成你自己的資料。
# 營收、支出、薪資會自動從員工系統（app/data/crm.db）讀，這裡只放「系統外」的資料。
#
# ⚠️ 這份股東頁是內部管理用的試算，原則上不能取代會計師簽證的財務報表與報稅資料。

[ledger]
title = "股東帳務"
period_start = "2026-01-01"     # 從哪個月開始算（通常＝開店月）
show_payroll_detail = false     # true＝股東看得到每個人的薪資；false＝只看每月總額（建議）
show_receipts = true            # 支出明細附單據照片（只附老闆核銷過的）

# ── 股東與出資 ──
[[shareholders]]
name = "股東甲"
committed = 600000      # 認股（答應出資）金額
paid = 600000           # 已經匯進來的金額

[[shareholders]]
name = "股東乙"
committed = 400000
paid = 300000

# ── 期初（開始用系統那天，戶頭和抽屜各有多少；不含股東出資，出資另外寫在上面）──
[opening]
date = "2026-01-01"
bank = 0
cash = 0

# ── 系統外的手記項目 ──
# kind：
#   支出 ＝ 開店前或系統外的花費（裝潢、設備、加盟金、規費）→ 算進損益
#   收入 ＝ 系統外的收入（例如補助款、利息）→ 算進損益
#   押金 ＝ 會退回來的錢（房屋押金、保證金）→ 不算損益，算資產
#   借入 ＝ 借來的錢（正數）／還款（負數）→ 不算損益，算負債
[[entries]]
date = "2026-01-02"
kind = "支出"
category = "開辦費"
item = "裝潢工程"
amount = 250000
note = "示範資料"

[[entries]]
date = "2026-01-02"
kind = "押金"
category = "押金"
item = "房屋押金"
amount = 60000
note = "退租可退"

# ── 對帳點（選填）：某天實際的戶頭和抽屜金額，股東頁會顯示和系統估計差多少 ──
[[balance_checks]]
date = "2026-01-31"
bank = 585000
cash = 5000

# ── 單位成本（選填）：每項商品／服務的成本拆解，股東頁會算出毛利 ──
# 便當店填一個便當、飲料店填一杯、美髮填一次服務。fees 是通路抽成（例如外送平台）。
[[products]]
name = "招牌便當"
price = 120
parts = [ { name = "主菜", cost = 38 }, { name = "白飯與配菜", cost = 15 }, { name = "餐盒與包材", cost = 6 } ]
fees = { "外送平台" = 0.30 }

[[products]]
name = "雞腿便當"
price = 130
parts = [ { name = "主菜", cost = 45 }, { name = "白飯與配菜", cost = 15 }, { name = "餐盒與包材", cost = 6 } ]
